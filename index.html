<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NSCT Industrial Skill Assessment v7</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap");
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background-color: #f8fafc;
        color: #0f172a;
      }
      .option-card {
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        border: 2px solid #e2e8f0;
      }
      .option-card:hover:not(.locked) {
        border-color: #6366f1;
        background-color: #f5f3ff;
      }
      .correct-anim {
        border-color: #10b981 !important;
        background-color: #ecfdf5 !important;
        color: #065f46 !important;
      }
      .wrong-anim {
        border-color: #ef4444 !important;
        background-color: #fef2f2 !important;
        color: #991b1b !important;
      }
      .nav-dot {
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.75rem;
        font-weight: 700;
        border-radius: 6px;
        cursor: pointer;
        transition: 0.2s;
        border: 1px solid #e2e8f0;
      }
      .nav-dot.current {
        ring: 2px offset 2px #6366f1;
        border-color: #6366f1;
      }
      .progress-bar {
        transition: width 0.8s ease;
      }
    </style>
  </head>
  <body>
    <div id="app" class="max-w-7xl mx-auto p-6 min-h-screen">
      <div
        id="setup-screen"
        class="max-w-xl mx-auto bg-white p-12 rounded-3xl shadow-xl mt-20 border border-slate-200"
      >
        <div class="text-center mb-10">
          <div
            class="inline-block px-4 py-1.5 bg-indigo-100 text-indigo-700 text-[10px] font-black uppercase tracking-widest rounded-full mb-4"
          >
            Industrial Placement Portal
          </div>
          <h1 class="text-4xl font-extrabold tracking-tight text-slate-900">
            NSCT <span class="text-indigo-600">V7</span>
          </h1>
          <p class="text-slate-500 mt-2 font-medium">
            Graduate Skills Competency Assessment
          </p>
        </div>

        <div class="space-y-6">
          <div>
            <label class="block text-xs font-bold text-slate-400 uppercase mb-2"
              >Government API Credential</label
            >
            <input
              type="password"
              id="api-key"
              class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none transition-all"
              placeholder="Enter API Key"
            />
          </div>
          <button
            onclick="startIndustrialExam()"
            class="w-full bg-slate-900 text-white py-5 rounded-2xl font-bold shadow-2xl hover:bg-black active:scale-95 transition-all text-sm uppercase tracking-widest"
          >
            Start Competency Test
          </button>
        </div>
      </div>

      <div id="exam-screen" class="hidden flex flex-col lg:flex-row gap-8">
        <aside class="lg:w-80 space-y-6 order-2 lg:order-1">
          <div
            class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200"
          >
            <h3
              class="text-xs font-black uppercase text-slate-400 mb-6 flex justify-between"
            >
              Question Map <span id="completion-text">0%</span>
            </h3>
            <div id="nav-grid" class="grid grid-cols-5 gap-2"></div>
          </div>
        </aside>

        <main class="flex-1 order-1 lg:order-2">
          <div
            id="loader"
            class="bg-white p-20 rounded-3xl border border-slate-200 text-center"
          >
            <div class="w-full bg-slate-100 rounded-full h-1.5 mb-6">
              <div
                id="loading-bar"
                class="progress-bar bg-indigo-600 h-full w-0"
              ></div>
            </div>
            <p
              id="loading-status"
              class="text-slate-400 font-bold text-xs uppercase animate-pulse"
            >
              Syncing Industrial Competency Framework...
            </p>
          </div>

          <div
            id="question-area"
            class="hidden bg-white p-12 rounded-3xl shadow-sm border border-slate-200 min-h-[600px] flex flex-col"
          >
            <div class="flex justify-between items-center mb-10">
              <span
                id="q-category"
                class="px-3 py-1 bg-slate-100 text-slate-600 text-[10px] font-black uppercase tracking-widest rounded-md"
              ></span>
              <div class="text-right">
                <p class="text-[10px] font-bold text-slate-400 uppercase">
                  Remaining Time
                </p>
                <span id="timer" class="text-xl font-bold text-indigo-600"
                  >120:00</span
                >
              </div>
            </div>

            <h2
              id="q-text"
              class="text-2xl font-bold text-slate-900 mb-10 leading-snug"
            ></h2>

            <div
              id="options-container"
              class="grid grid-cols-1 gap-4 mb-auto"
            ></div>

            <div
              class="flex justify-between items-center mt-12 pt-8 border-t border-slate-100"
            >
              <button
                onclick="prevQ()"
                class="font-bold text-slate-400 hover:text-slate-900 transition"
              >
                ← Previous
              </button>
              <button
                onclick="nextQ()"
                class="px-10 py-4 bg-indigo-600 text-white rounded-2xl font-bold shadow-lg hover:bg-indigo-700 transition-all"
              >
                Next Question →
              </button>
            </div>
          </div>
        </main>
      </div>

      <div
        id="result-screen"
        class="hidden max-w-4xl mx-auto bg-white p-12 rounded-[40px] shadow-2xl mt-10 border border-slate-100 text-center"
      >
        <h1
          class="text-2xl font-black text-slate-400 uppercase tracking-[0.2em] mb-4"
        >
          Competency Report
        </h1>

        <div
          id="status-badge"
          class="inline-block px-8 py-2 rounded-full font-black uppercase tracking-widest text-sm mb-6"
        ></div>

        <div
          id="final-score"
          class="text-[140px] font-black text-slate-900 leading-none my-2"
        >
          0
        </div>
        <p id="percentage-text" class="text-indigo-600 font-black text-xl mb-8">
          0%
        </p>

        <p
          class="text-slate-500 font-bold uppercase text-xs tracking-widest mb-12 border-t border-slate-100 pt-8"
        >
          Industrial Readiness Score
        </p>

        <div
          id="category-breakdown"
          class="grid grid-cols-1 md:grid-cols-2 gap-4 text-left mb-12"
        ></div>

        <div class="flex gap-4">
          <button
            onclick="showReview()"
            class="flex-1 bg-slate-900 text-white py-5 rounded-2xl font-bold uppercase tracking-widest text-xs hover:bg-black transition"
          >
            Full Audit
          </button>
          <button
            onclick="location.reload()"
            class="flex-1 bg-indigo-50 text-indigo-600 py-5 rounded-2xl font-bold uppercase tracking-widest text-xs border border-indigo-100 hover:bg-indigo-100 transition"
          >
            Restart Test
          </button>
        </div>
      </div>
    </div>

    <script>
      let questions = [];
      let userAnswers = {};
      let currentIndex = 0;
      let timerSeconds = 7200;
      let timerInterval;
      let isReviewMode = false;

      const MODELS = [
        "gemini-3-flash-preview",
        "gemini-3.1-flash-lite-preview",
      ];

      // Exact weights from AreasOfCompetencies.doc [cite: 30, 32, 71, 87, 105, 123, 140, 158]
      const batchConfigs = [
        {
          count: 18,
          area: "Problem Solving & Analytical Skills",
          weight: "20%",
          topics:
            "Logical Reasoning, Flow Control, Pattern Recognition, Quantitative Reasoning, Algorithmic Thinking, Debugging, Real-World Problem Solving, Data-Driven Decision Making.",
        },
        {
          count: 9,
          area: "Programming (C++/Java/Python)",
          weight: "10%",
          topics:
            "OOP, Exception Handling, Memory Management, Concurrency, Libraries/Modules, Control Structures, I/O Handling, Debugging & Optimization.",
        },
        {
          count: 9,
          area: "Data Structures & Algorithms",
          weight: "10%",
          topics:
            "Linear/Non-Linear DS, Hashing, Graph/Tree Algorithms, Search/Sort, Complexity (Big O) & Optimization, Algorithm Design Techniques.",
        },
        {
          count: 9,
          area: "Software Engineering",
          weight: "10%",
          topics:
            "Agile, Requirements Engineering, Architecture, QA & Testing, Software Metrics, Configuration Management, Security Engineering.",
        },
        {
          count: 9,
          area: "Web Development",
          weight: "10%",
          topics:
            "Architecture & Protocols, Frontend Frameworks, Backend Server-Side, Web Security, Deployment, Modern APIs, Performance Optimization.",
        },
        {
          count: 9,
          area: "AI/ML & Data Analytics",
          weight: "10%",
          topics:
            "EDA, Supervised/Unsupervised Learning, Deep Learning, NLP, Computer Vision, MLOps, AI Ethics, Mathematical Foundations.",
        },
        {
          count: 9,
          area: "Databases",
          weight: "10%",
          topics:
            "Normalization, SQL/NoSQL, Transaction Management, Concurrency Control, Distributed Databases, Indexing, Query Optimization.",
        },
        {
          count: 9,
          area: "Computer Networks & Cloud",
          weight: "10%",
          topics:
            "Data Communication, OSI Layers, Wireless Networks, Cloud Computing, Network Security, Next-Generation Networks.",
        },
        {
          count: 5,
          area: "Cyber Security",
          weight: "5%",
          topics:
            "Cryptography, Malware Attack Techniques, Authentication, Digital Forensics, Incident Response, Cyber Laws & Ethics.",
        },
        {
          count: 4,
          area: "Operating Systems",
          weight: "5%",
          topics:
            "Process Management, CPU Scheduling, Deadlocks, Memory Management, File Systems, OS Protection & Security.",
        },
      ];

      async function startIndustrialExam() {
        // 1. Try to get key from input, if empty, check browser memory (localStorage)
        let apiKey = document.getElementById("api-key").value;

        if (!apiKey) {
          apiKey = localStorage.getItem("nsct_api_key");
        }

        // 2. If still no key, alert the user
        if (!apiKey) {
          return alert(
            "System requires Authentication Key. Please enter it once to save it.",
          );
        }

        // 3. Save the key for next time so you never have to type it again
        localStorage.setItem("nsct_api_key", apiKey);

        // Proceed with UI changes
        document.getElementById("setup-screen").classList.add("hidden");
        document.getElementById("exam-screen").classList.remove("hidden");

        for (let model of MODELS) {
          try {
            questions = [];
            document.getElementById("loading-status").innerText =
              `CALIBRATING ${model.toUpperCase()}...`;

            const fetchPromises = batchConfigs.map((batch) =>
              fetchBatch(batch, apiKey, model),
            );

            const results = await Promise.all(fetchPromises);
            questions = results.flat();

            if (questions.length >= 90) {
              launchExam();
              return;
            }
          } catch (err) {
            console.error("Model failed, trying next...", err);
          }
        }

        alert("API Connection Failed. Please check your key or internet.");
        location.reload();
      }

      async function fetchBatch(batch, apiKey, modelName) {
        const prompt = `
        ### ROLE:
        Act as an NSCT Expert Examiner (P@SHA/HEC standards). 
        Your goal: Create "Short-Cut" questions that teach the core logic of a topic through practice.

        ### OBJECTIVE:
        Generate ${batch.count} MCQs for: ${batch.area}.
        WEIGHTAGE: ${batch.weight}
        TOPICS: ${batch.topics}

        ### NSCT-SPECIFIC QUESTION TYPES:
        1. CODE-TRACING: (For Programming/DSA) Show a 4-5 line snippet and ask for the output. Focus on common traps (e.g., increment operators, scope, or edge cases).
        2. SCENARIO-ANALYSIS: (For SE/Web/Networks) "A developer wants to [Goal]. Which [Architecture/Protocol] is best?"
        3. CONCEPTUAL COMPARISON: (For OS/Databases) Differentiate between things like Process vs Thread, or SQL vs NoSQL scaling.
        4. CLOUD & SECURITY TRAPS: Focus on shared responsibility models and common attack vectors like SQLi or Phishing.

        ### "STUDENT-FRIENDLY" EXTRAS:
        - EVERY question must have a 'revision_note' that summarizes the "Rule of Thumb" for that topic.
        - Options should be plausible but clearly distinct if you know the "Rule."

        ### OUTPUT FORMAT (STRICT JSON):
        [
          {
            "area": "${batch.area}",
            "q": "The question or code snippet here...",
            "options": ["A", "B", "C", "D"],
            "correct": 0,
            "revision_note": "A 1-sentence 'Cheat Sheet' (e.g., 'Tip: Threads share memory within a process, but Processes have isolated memory.')"
          }
        ]
    `;

        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: {
                responseMimeType: "application/json",
                temperature: 0.8, // High enough to give you fresh questions each time
              },
            }),
          },
        );

        const data = await response.json();
        try {
          const rawText = data.candidates[0].content.parts[0].text;
          return JSON.parse(rawText);
        } catch (e) {
          console.error(`Error in ${batch.area}:`, e);
          return [];
        }
      }

      function launchExam() {
        document.getElementById("loader").classList.add("hidden");
        document.getElementById("question-area").classList.remove("hidden");
        initNavGrid();
        renderQuestion();
        startTimer();
      }

      function renderQuestion() {
        const q = questions[currentIndex];
        document.getElementById("q-category").innerText = q.area;
        document.getElementById("q-text").innerText = q.q;

        const container = document.getElementById("options-container");
        container.innerHTML = "";

        q.options.forEach((opt, i) => {
          const btn = document.createElement("button");
          const isSelected = userAnswers[currentIndex] === i;
          const isCorrect = q.correct === i;

          let style = "bg-white border-slate-200 text-slate-700";

          // LIVE GRADING LOGIC: Show correct/wrong as soon as answered
          if (userAnswers[currentIndex] !== undefined) {
            if (isCorrect) style = "correct-anim";
            else if (isSelected) style = "wrong-anim";
          }

          btn.className = `option-card w-full text-left p-5 rounded-2xl border-2 font-semibold flex items-center gap-4 ${style} ${userAnswers[currentIndex] !== undefined ? "locked cursor-default" : ""}`;
          btn.innerHTML = `<span class="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center text-xs font-black text-slate-400">${String.fromCharCode(65 + i)}</span> ${opt}`;

          if (userAnswers[currentIndex] === undefined) {
            btn.onclick = () => {
              userAnswers[currentIndex] = i;
              renderQuestion();
              updateStats();
            };
          }
          container.appendChild(btn);
        });
        updateNavGrid();
      }

      function initNavGrid() {
        const grid = document.getElementById("nav-grid");
        grid.innerHTML = "";
        questions.forEach((_, i) => {
          const btn = document.createElement("div");
          btn.className = "nav-dot bg-slate-50 text-slate-400";
          btn.innerText = i + 1;
          btn.onclick = () => {
            currentIndex = i;
            renderQuestion();
          };
          grid.appendChild(btn);
        });
      }

      function updateNavGrid() {
        document.querySelectorAll(".nav-dot").forEach((b, i) => {
          b.classList.remove(
            "current",
            "bg-indigo-600",
            "bg-emerald-500",
            "bg-red-500",
            "text-white",
          );
          if (i === currentIndex) b.classList.add("current");

          if (userAnswers[i] !== undefined) {
            if (userAnswers[i] === questions[i].correct)
              b.classList.add("bg-emerald-500", "text-white");
            else b.classList.add("bg-red-500", "text-white");
          }
        });
      }

      function updateStats() {
        const count = Object.keys(userAnswers).length;
        document.getElementById("completion-text").innerText = count + "%";
      }

      function nextQ() {
        if (currentIndex < questions.length - 1) {
          currentIndex++;
          renderQuestion();
        }
      }
      function prevQ() {
        if (currentIndex > 0) {
          currentIndex--;
          renderQuestion();
        }
      }
      function confirmSubmit() {
        if (confirm("Ready to generate your Industrial Competency Report?"))
          finishExam();
      }

      function finishExam() {
        clearInterval(timerInterval);
        document.getElementById("exam-screen").classList.add("hidden");
        document.getElementById("result-screen").classList.remove("hidden");

        let correctCount = 0;
        const totalQuestions = questions.length;
        const areas = {};

        questions.forEach((q, i) => {
          if (!areas[q.area]) areas[q.area] = { c: 0, t: 0 };
          areas[q.area].t++;
          if (userAnswers[i] === q.correct) {
            correctCount++;
            areas[q.area].c++;
          }
        });

        const percentage = Math.round((correctCount / totalQuestions) * 100);
        const passThreshold = 50;
        const isPassed = percentage >= passThreshold;

        // Update UI Elements
        document.getElementById("final-score").innerText = correctCount;
        document.getElementById("percentage-text").innerText =
          `${percentage}% Overall Mastery`;

        const badge = document.getElementById("status-badge");
        if (isPassed) {
          badge.innerText = "PASSED: Industry Ready";
          badge.className =
            "inline-block px-8 py-2 rounded-full font-black uppercase tracking-widest text-sm mb-6 bg-emerald-100 text-emerald-700 border border-emerald-200";
        } else {
          badge.innerText = "FAILED: Additional Training Required";
          badge.className =
            "inline-block px-8 py-2 rounded-full font-black uppercase tracking-widest text-sm mb-6 bg-red-100 text-red-700 border border-red-200";
        }

        // Category Breakdown
        const breakdown = document.getElementById("category-breakdown");
        breakdown.innerHTML = "";
        for (let a in areas) {
          const areaPerc = Math.round((areas[a].c / areas[a].t) * 100);
          breakdown.innerHTML += `
            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 flex flex-col gap-2">
                <div class="flex justify-between items-center">
                    <span class="font-bold text-[10px] uppercase text-slate-400">${a}</span>
                    <span class="font-black text-slate-900">${areas[a].c}/${areas[a].t}</span>
                </div>
                <div class="w-full bg-slate-200 rounded-full h-1">
                    <div class="bg-indigo-500 h-1 rounded-full" style="width: ${areaPerc}%"></div>
                </div>
            </div>`;
        }
      }

      function showReview() {
        document.getElementById("result-screen").classList.add("hidden");
        document.getElementById("exam-screen").classList.remove("hidden");
        currentIndex = 0;
        renderQuestion();
      }

      function startTimer() {
        timerInterval = setInterval(() => {
          timerSeconds--;
          const m = Math.floor(timerSeconds / 60);
          const s = timerSeconds % 60;
          document.getElementById("timer").innerText =
            `${m}:${s < 10 ? "0" : ""}${s}`;
          if (timerSeconds <= 0) finishExam();
        }, 1000);
      }
    </script>
  </body>
</html>
